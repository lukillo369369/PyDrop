name: Windows distribution

on:
  workflow_dispatch:
  push:
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'build_windows.ps1'
      - 'packaging/**'
      - 'assets/**'
      - 'examples/**'
      - 'tools/**'
      - '.github/workflows/windows-distribution.yml'
  pull_request:
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'build_windows.ps1'
      - 'packaging/**'
      - 'assets/**'
      - 'examples/**'
      - 'tools/**'
      - '.github/workflows/windows-distribution.yml'

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Select pinned x64 Python
        id: python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.15.1'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install locked build dependencies
        run: |
          & '${{ steps.python.outputs.python-path }}' -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Installing the build dependency lock failed.' }
      - name: Check Windows distribution safeguards
        run: |
          & '${{ steps.python.outputs.python-path }}' -m unittest discover -s tests -p test_windows_distribution.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows distribution safeguard tests failed.' }
      - name: Extract pinned Inno Setup compiler
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $expected = '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expected) {
              throw 'Inno Setup download does not match the pinned SHA256.'
          }
          $innoPath = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $arguments = '/PORTABLE=1 /VERYSILENT /CURRENTUSER /NOICONS /NORESTART /DIR="' + $innoPath + '"'
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup extraction failed: $($process.ExitCode)" }
          "PYDROP_ISCC=$innoPath\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build desktop and per-user installer
        run: |
          .\build_windows.ps1 -Python '${{ steps.python.outputs.python-path }}' -Iscc $env:PYDROP_ISCC -Output dist
          if ($LASTEXITCODE -ne 0) { throw 'Desktop distribution build failed.' }
      - name: Build standalone simulated sensor graph
        run: |
          & '${{ steps.python.outputs.python-path }}' tools/build_graph.py examples/sensor_dashboard.nodeforge.json --name SimulatedSensor --output-dir dist/graph
          if ($LASTEXITCODE -ne 0) { throw 'Standalone graph build failed; inspect the retained dependency report and build log.' }
      - name: Stage artifacts without source or Python
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'PyDrop-artifact-only'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath dist/PyDrop -Destination $stage -Recurse
          Get-ChildItem -LiteralPath dist -Filter 'PyDrop-*-setup.exe' -File | Copy-Item -Destination $stage
          Copy-Item -LiteralPath tools/clean_windows_test.ps1 -Destination $stage
          $graphPath = Join-Path $stage 'graph'
          New-Item -ItemType Directory -Path $graphPath -Force | Out-Null
          Copy-Item -LiteralPath dist/graph/SimulatedSensor/executable/SimulatedSensor.exe -Destination $graphPath
          "PYDROP_SMOKE_INPUT=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Smoke test artifacts with Python removed from PATH
        run: |
          $testScript = Join-Path $env:PYDROP_SMOKE_INPUT 'clean_windows_test.ps1'
          $graphExecutable = Join-Path $env:PYDROP_SMOKE_INPUT 'graph/SimulatedSensor.exe'
          & $testScript -ArtifactRoot $env:PYDROP_SMOKE_INPUT -GraphExecutable $graphExecutable -ReportDirectory (Join-Path $env:GITHUB_WORKSPACE 'dist/smoke-reports')
      - name: Retain distributions, editable sources, dependency reports and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: PyDrop-windows-x64
          path: |
            dist/
            build/**/*.txt
            build/**/*.log
          if-no-files-found: warn
          retention-days: 14
